<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#101016" />
    <title>Movie Mojo</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./apple-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="stylesheet" href="./style.css" />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"
    ></script>
    <script defer src="./config.js"></script>
    <script defer src="./app.js"></script>
  </head>
  <body>
    <header>
      <a class="brand" href="#watchlist"
        ><span class="brand-icon">M<span>✦</span></span> movie mojo<span
          class="brand-dot"
          >.</span
        ></a
      ><button id="account-button" class="avatar" aria-label="Open profile">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="9" />
          <circle cx="12" cy="9" r="3" />
          <path d="M5 19a7 7 0 0 1 14 0" />
        </svg>
      </button>
    </header>
    <main id="app"><p class="loading">Setting the scene…</p></main>
    <nav id="navigation" hidden aria-label="Main navigation">
      <button data-tab="watchlist">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          aria-hidden="true"
        >
          <rect x="5" y="3" width="14" height="18" rx="3" />
          <path d="M9 8h6M9 12h6M9 16h4" /></svg
        ><span>Watchlist</span></button
      ><button data-tab="discover">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          aria-hidden="true"
        >
          <circle cx="10.5" cy="10.5" r="6.5" />
          <path d="m16 16 5 5" /></svg
        ><span>Discover</span></button
      ><button data-tab="groups">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          aria-hidden="true"
        >
          <circle cx="9" cy="8" r="3" />
          <path
            d="M3 21v-3a6 6 0 0 1 12 0v3M16 5a3 3 0 0 1 0 6M18 15a5 5 0 0 1 3 4v2"
          /></svg
        ><span>Groups</span></button
      ><button data-tab="profile">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="9" />
          <circle cx="12" cy="9" r="3" />
          <path d="M5 19a7 7 0 0 1 14 0" /></svg
        ><span>Profile</span>
      </button>
    </nav>
    <dialog id="modal">
      <button id="close-modal" class="close" aria-label="Close dialog">
        ×
      </button>
      <div id="modal-content"></div>
    </dialog>
    <div id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
